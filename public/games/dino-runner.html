<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 600px;
    margin-bottom: 12px;
  }
  .title {
    font-size: 24px;
    font-weight: 800;
    color: #10b981;
    letter-spacing: -0.5px;
  }
  .stats {
    display: flex;
    gap: 12px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .stat-item {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .game-container {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 240px;
    border: 2px solid #334155;
    border-radius: 12px;
    overflow: hidden;
    background: #0f172a;
    box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    backdrop-filter: blur(4px);
  }
  .overlay.active { display: flex; }
  .btn {
    background: #10b981;
    color: #042f1a;
    font-weight: 700;
    font-size: 14px;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: #34d399; transform: scale(1.02); }
  .instructions {
    margin-top: 12px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Cyber Runner</div>
    <div class="stats">
      <div class="stat-item">Distance: <strong id="score" style="color:#10b981;">0m</strong></div>
      <div class="stat-item">Record: <strong id="high" style="color:#38bdf8;">0m</strong></div>
    </div>
  </div>

  <div class="game-container">
    <canvas id="canvas" width="600" height="240"></canvas>
    <div class="overlay active" id="overlay">
      <h2 id="overlay-msg" style="color: #10b981; font-size: 26px;">Cyber Runner</h2>
      <p id="overlay-sub" style="color: #94a3b8; font-size: 14px;">Jump over cyber barriers to survive!</p>
      <button class="btn" id="start-btn">Start Run</button>
    </div>
  </div>

  <div class="instructions">Spacebar or Up Arrow / Tap screen to jump. Down Arrow to duck.</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlaySub = document.getElementById('overlay-sub');
  const startBtn = document.getElementById('start-btn');

  const GROUND_Y = 190;
  let dino = { x: 50, y: GROUND_Y - 40, w: 32, h: 40, vy: 0, jumping: false, ducking: false };
  let obstacles = [];
  let score = 0;
  let highScore = parseInt(localStorage.getItem('runner_best') || '0', 10);
  let isPlaying = false;
  let gameSpeed = 5;
  let frameCount = 0;
  let nextObstacle = 80;

  highEl.innerText = `${highScore}m`;

  function jump() {
    if (!isPlaying) { start(); return; }
    if (!dino.jumping) {
      dino.vy = -12;
      dino.jumping = true;
    }
  }

  function start() {
    dino.y = GROUND_Y - 40;
    dino.h = 40;
    dino.vy = 0;
    dino.jumping = false;
    dino.ducking = false;
    obstacles = [];
    score = 0;
    gameSpeed = 5.5;
    frameCount = 0;
    nextObstacle = 60;
    isPlaying = true;
    overlay.classList.remove('active');
  }

  function update() {
    if (!isPlaying) return;
    frameCount++;
    score = Math.floor(frameCount / 4);
    scoreEl.innerText = `${score}m`;

    if (frameCount % 600 === 0) gameSpeed += 0.5;

    // jump physics
    if (dino.jumping) {
      dino.vy += 0.7; // gravity
      dino.y += dino.vy;
      if (dino.y >= GROUND_Y - dino.h) {
        dino.y = GROUND_Y - dino.h;
        dino.jumping = false;
        dino.vy = 0;
      }
    }

    // obstacles
    nextObstacle--;
    if (nextObstacle <= 0) {
      const type = Math.random() > 0.4 ? 'CACTUS' : 'FLYER';
      if (type === 'CACTUS') {
        const h = 30 + Math.random() * 20;
        obstacles.push({ x: canvas.width, y: GROUND_Y - h, w: 20, h: h, type });
      } else {
        obstacles.push({ x: canvas.width, y: GROUND_Y - 45 - Math.random() * 25, w: 30, h: 18, type });
      }
      nextObstacle = Math.floor(Math.random() * 50) + 60;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ob = obstacles[i];
      ob.x -= gameSpeed;

      // collision
      if (
        dino.x + dino.w - 6 > ob.x &&
        dino.x + 6 < ob.x + ob.w &&
        dino.y + dino.h - 4 > ob.y &&
        dino.y + 4 < ob.y + ob.h
      ) {
        endGame();
        return;
      }

      if (ob.x < -50) obstacles.splice(i, 1);
    }
  }

  function endGame() {
    isPlaying = false;
    if (score > highScore) {
      highScore = score;
      highEl.innerText = `${highScore}m`;
      localStorage.setItem('runner_best', highScore);
    }
    overlayMsg.innerText = 'Crashed!';
    overlaySub.innerText = `You reached ${score}m!`;
    startBtn.innerText = 'Try Again';
    overlay.classList.add('active');
  }

  function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid lines in background
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = (-(frameCount * gameSpeed) % 40); x < canvas.width; x += 40) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, GROUND_Y);
    }
    ctx.stroke();

    // ground line
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    // obstacles
    obstacles.forEach(ob => {
      ctx.fillStyle = ob.type === 'CACTUS' ? '#f43f5e' : '#eab308';
      ctx.shadowBlur = 8;
      ctx.shadowColor = ctx.fillStyle;
      ctx.beginPath();
      ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
      ctx.fill();
    });

    // player dino/runner
    ctx.fillStyle = '#10b981';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#10b981';
    ctx.beginPath();
    ctx.roundRect(dino.x, dino.y, dino.w, dino.h, 6);
    ctx.fill();

    // eye & visor
    ctx.fillStyle = '#042f1a';
    ctx.fillRect(dino.x + 20, dino.y + 6, 8, 4);

    ctx.shadowBlur = 0;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
      jump();
      e.preventDefault();
    }
    if (e.code === 'ArrowDown' || e.key === 's') {
      if (!dino.jumping) {
        dino.ducking = true;
        dino.h = 24;
        dino.y = GROUND_Y - 24;
      }
    }
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowDown' || e.key === 's') {
      dino.ducking = false;
      dino.h = 40;
      if (!dino.jumping) dino.y = GROUND_Y - 40;
    }
  });

  canvas.addEventListener('pointerdown', jump);
  startBtn.onclick = start;
  draw();
  loop();
</script>
</body>
</html>
