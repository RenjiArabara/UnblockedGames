<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Sky</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 400px;
    margin-bottom: 12px;
  }
  .title {
    font-size: 24px;
    font-weight: 800;
    color: #f59e0b;
    letter-spacing: -0.5px;
  }
  .scores {
    display: flex;
    gap: 12px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .score-item {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .game-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 520px;
    border: 2px solid #334155;
    border-radius: 12px;
    overflow: hidden;
    background: #0284c7;
    box-shadow: 0 0 30px rgba(245, 158, 11, 0.15);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    backdrop-filter: blur(4px);
  }
  .btn {
    background: #f59e0b;
    color: #451a03;
    font-weight: 700;
    font-size: 15px;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: #fbbf24; transform: scale(1.02); }
  .instructions {
    margin-top: 12px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Flappy Sky</div>
    <div class="scores">
      <div class="score-item">Score: <strong id="score" style="color:#f59e0b;">0</strong></div>
      <div class="score-item">High: <strong id="high" style="color:#38bdf8;">0</strong></div>
    </div>
  </div>

  <div class="game-container">
    <canvas id="canvas" width="400" height="520"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg" style="color: #f59e0b; font-size: 26px;">Flappy Sky</h2>
      <p style="color: #94a3b8; font-size: 14px;">Press Space or Tap screen to jump</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <div class="instructions">Press Spacebar or Click/Tap anywhere to flap</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');

  let bird = { x: 80, y: 240, vy: 0, radius: 14, rot: 0 };
  let pipes = [];
  let score = 0;
  let highScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
  let state = 'START'; // START, PLAYING, GAMEOVER
  let frameCount = 0;
  highEl.innerText = highScore;

  function flap() {
    if (state === 'START' || state === 'GAMEOVER') {
      startGame();
      return;
    }
    bird.vy = -7.5;
  }

  function startGame() {
    bird.y = 240;
    bird.vy = 0;
    pipes = [];
    score = 0;
    scoreEl.innerText = score;
    frameCount = 0;
    state = 'PLAYING';
    overlay.style.display = 'none';
  }

  function gameOver() {
    state = 'GAMEOVER';
    overlayMsg.innerText = 'Game Over';
    startBtn.innerText = 'Try Again';
    overlay.style.display = 'flex';
    if (score > highScore) {
      highScore = score;
      highEl.innerText = highScore;
      localStorage.setItem('flappy_best', highScore);
    }
  }

  function update() {
    if (state !== 'PLAYING') return;
    frameCount++;

    // bird physics
    bird.vy += 0.38; // gravity
    bird.y += bird.vy;
    bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10)));

    // ceiling / floor
    if (bird.y + bird.radius > canvas.height - 30) {
      gameOver();
      return;
    }
    if (bird.y - bird.radius < 0) {
      bird.y = bird.radius;
      bird.vy = 0;
    }

    // spawn pipes
    if (frameCount % 90 === 0) {
      const gap = 125;
      const minTop = 60;
      const maxTop = canvas.height - 180;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
      });
    }

    // move pipes
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= 2.4;

      // collision detection
      if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 52) {
        if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
          gameOver();
          return;
        }
      }

      // score point
      if (!p.passed && p.x + 52 < bird.x) {
        p.passed = true;
        score++;
        scoreEl.innerText = score;
      }

      // remove offscreen
      if (p.x < -60) {
        pipes.splice(i, 1);
      }
    }
  }

  function draw() {
    // sky background gradient
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, '#0284c7');
    sky.addColorStop(0.7, '#38bdf8');
    sky.addColorStop(1, '#bae6fd');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(60, 100, 30, 0, Math.PI*2);
    ctx.arc(100, 90, 40, 0, Math.PI*2);
    ctx.arc(140, 100, 30, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(280, 160, 25, 0, Math.PI*2);
    ctx.arc(310, 150, 35, 0, Math.PI*2);
    ctx.arc(340, 160, 25, 0, Math.PI*2);
    ctx.fill();

    // pipes
    pipes.forEach(p => {
      // top pipe
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(p.x, 0, 52, p.top);
      ctx.fillStyle = '#15803d';
      ctx.fillRect(p.x - 3, p.top - 20, 58, 20);

      // bottom pipe
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(p.x, p.bottom, 52, canvas.height - p.bottom - 30);
      ctx.fillStyle = '#15803d';
      ctx.fillRect(p.x - 3, p.bottom, 58, 20);
    });

    // ground
    ctx.fillStyle = '#eab308';
    ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, canvas.height - 30, canvas.width, 6);

    // bird
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // bird body
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#b45309';
    ctx.stroke();

    // bird eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(8, -4, 2, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#ea580c';
    ctx.beginPath();
    ctx.moveTo(8, 2);
    ctx.lineTo(18, 6);
    ctx.lineTo(8, 10);
    ctx.closePath();
    ctx.fill();

    // wing
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.ellipse(-6, 2, 7, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      flap();
      e.preventDefault();
    }
  });

  canvas.addEventListener('pointerdown', e => {
    flap();
    e.preventDefault();
  });

  startBtn.onclick = () => startGame();

  loop();
</script>
</body>
</html>
