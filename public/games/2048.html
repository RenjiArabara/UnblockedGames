<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Classic 2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    touch-action: none;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 400px;
    margin-bottom: 16px;
  }
  .title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #38bdf8;
  }
  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 6px 14px;
    border-radius: 8px;
    text-align: center;
    min-width: 70px;
  }
  .score-label {
    font-size: 10px;
    text-transform: uppercase;
    color: #94a3b8;
    font-weight: 600;
  }
  .score-val {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .controls-bar {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #2563eb; }
  .grid-container {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 12px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 10px;
    position: relative;
  }
  .cell {
    background: #0f172a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
    color: #f8fafc;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .cell[data-val="2"] { background: #334155; color: #f8fafc; }
  .cell[data-val="4"] { background: #475569; color: #f8fafc; }
  .cell[data-val="8"] { background: #ea580c; color: #fff; }
  .cell[data-val="16"] { background: #f97316; color: #fff; }
  .cell[data-val="32"] { background: #e11d48; color: #fff; }
  .cell[data-val="64"] { background: #f43f5e; color: #fff; }
  .cell[data-val="128"] { background: #eab308; color: #000; font-size: 22px; box-shadow: 0 0 10px #eab30866; }
  .cell[data-val="256"] { background: #facc15; color: #000; font-size: 22px; box-shadow: 0 0 12px #facc1588; }
  .cell[data-val="512"] { background: #10b981; color: #fff; font-size: 22px; box-shadow: 0 0 14px #10b98188; }
  .cell[data-val="1024"] { background: #06b6d4; color: #fff; font-size: 18px; box-shadow: 0 0 16px #06b6d4aa; }
  .cell[data-val="2048"] { background: #8b5cf6; color: #fff; font-size: 18px; box-shadow: 0 0 20px #8b5cf6dd; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .overlay-text { font-size: 28px; font-weight: 800; color: #38bdf8; }
  .instructions {
    margin-top: 14px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-val">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best" class="score-val">0</div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <span style="font-size: 12px; color: #94a3b8;">Join tiles to reach <b>2048</b>!</span>
    <button class="btn" id="new-game-btn">New Game</button>
  </div>

  <div class="grid-container" id="grid">
    <div class="overlay" id="game-over-overlay">
      <div class="overlay-text" id="overlay-msg">Game Over</div>
      <button class="btn" id="retry-btn">Try Again</button>
    </div>
  </div>

  <div class="instructions">Use Arrow Keys, WASD, or swipe on touch screens</div>

<script>
  let board = Array(16).fill(0);
  let score = 0;
  let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
  document.getElementById('best').innerText = best;

  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('game-over-overlay');
  const overlayMsg = document.getElementById('overlay-msg');

  // build 16 cells
  const cells = [];
  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    gridEl.appendChild(c);
    cells.push(c);
  }

  function render() {
    for (let i = 0; i < 16; i++) {
      const v = board[i];
      cells[i].innerText = v > 0 ? v : '';
      if (v > 0) cells[i].setAttribute('data-val', v);
      else cells[i].removeAttribute('data-val');
    }
    scoreEl.innerText = score;
    if (score > best) {
      best = score;
      bestEl.innerText = best;
      localStorage.setItem('2048_best', best);
    }
  }

  function addRandomTile() {
    const emptyIndices = [];
    for (let i = 0; i < 16; i++) {
      if (board[i] === 0) emptyIndices.push(i);
    }
    if (emptyIndices.length === 0) return;
    const idx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    board[idx] = Math.random() < 0.9 ? 2 : 4;
  }

  function init() {
    board = Array(16).fill(0);
    score = 0;
    overlay.classList.remove('active');
    addRandomTile();
    addRandomTile();
    render();
  }

  function slide(row) {
    let arr = row.filter(v => v !== 0);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        score += arr[i];
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < 4) arr.push(0);
    return arr;
  }

  function move(direction) {
    let moved = false;
    let newBoard = [...board];

    if (direction === 'LEFT' || direction === 'RIGHT') {
      for (let r = 0; r < 4; r++) {
        let row = [board[r*4], board[r*4+1], board[r*4+2], board[r*4+3]];
        if (direction === 'RIGHT') row.reverse();
        let slided = slide(row);
        if (direction === 'RIGHT') slided.reverse();
        for (let c = 0; c < 4; c++) {
          if (newBoard[r*4 + c] !== slided[c]) moved = true;
          newBoard[r*4 + c] = slided[c];
        }
      }
    } else if (direction === 'UP' || direction === 'DOWN') {
      for (let c = 0; c < 4; c++) {
        let col = [board[c], board[c+4], board[c+8], board[c+12]];
        if (direction === 'DOWN') col.reverse();
        let slided = slide(col);
        if (direction === 'DOWN') slided.reverse();
        for (let r = 0; r < 4; r++) {
          if (newBoard[r*4 + c] !== slided[r]) moved = true;
          newBoard[r*4 + c] = slided[r];
        }
      }
    }

    if (moved) {
      board = newBoard;
      addRandomTile();
      render();
      checkStatus();
    }
  }

  function checkStatus() {
    if (board.includes(2048) && !overlay.classList.contains('active')) {
      overlayMsg.innerText = 'You Win!';
      overlay.classList.add('active');
      return;
    }
    // check moves
    if (board.includes(0)) return;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        let idx = r * 4 + c;
        if (c < 3 && board[idx] === board[idx + 1]) return;
        if (r < 3 && board[idx] === board[idx + 4]) return;
      }
    }
    overlayMsg.innerText = 'Game Over';
    overlay.classList.add('active');
  }

  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': move('LEFT'); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': move('RIGHT'); e.preventDefault(); break;
      case 'ArrowUp': case 'w': case 'W': move('UP'); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': move('DOWN'); e.preventDefault(); break;
    }
  });

  let touchStartX = 0, touchStartY = 0;
  window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', e => {
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
      move(dx > 0 ? 'RIGHT' : 'LEFT');
    } else if (Math.abs(dy) > 30) {
      move(dy > 0 ? 'DOWN' : 'UP');
    }
  }, { passive: true });

  document.getElementById('new-game-btn').onclick = init;
  document.getElementById('retry-btn').onclick = init;

  init();
</script>
</body>
</html>
